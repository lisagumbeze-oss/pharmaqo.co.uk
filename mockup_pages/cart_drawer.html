<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#0E1116;background:#FFFFFF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #19C3A6;outline-offset:2px}
</style>
</helmet>
<div style="width:420px;height:900px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;border:1px solid #E3E1DA">

<div style="display:flex;justify-content:space-between;align-items:center;padding:20px 20px 16px;border-bottom:1px solid #E3E1DA">
<h2 style="margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.03em">Your basket (3)</h2>
<button type="button" aria-label="Close basket" style="width:44px;height:44px;border:0;background:transparent;cursor:pointer"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0E1116" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="padding:16px 20px;background:#F6F5F1;display:flex;flex-direction:column;gap:8px;font-size:13px">
<span>You are £00.00 away from free UK delivery</span>
<div style="height:8px;border-radius:999px;background:#E3E1DA"><div style="width:68%;height:100%;border-radius:999px;background:#19C3A6"></div></div>
</div>

<div style="flex-grow:1;overflow:hidden;padding:0 20px;display:flex;flex-direction:column">
<sc-for list="{{items}}" as="i" hint-placeholder-count="3">
<div style="display:flex;gap:14px;padding:18px 0;border-bottom:1px solid #E3E1DA">
<div style="width:80px;height:80px;border-radius:8px;background:#ECEAE4;display:flex;align-items:center;justify-content:center;flex:none"><svg sc-camel-view-box="0 0 120 150" style="height:60px" aria-hidden="true"><rect x="14" y="22" width="92" height="112" rx="12" fill="{{i.tub}}"></rect><rect x="10" y="8" width="100" height="22" rx="7" fill="#0E1116"></rect><rect x="14" y="60" width="92" height="46" fill="#F6F5F1"></rect><rect x="14" y="106" width="92" height="6" fill="#19C3A6"></rect></svg></div>
<div style="flex-grow:1;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600;font-size:15px;line-height:1.3">{{i.name}}</span><span style="font-weight:600;font-size:15px">£00.00</span></div>
<span style="font-size:13px;color:#5B6470">{{i.variant}}</span>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
<div style="display:flex;align-items:center;border:1.5px solid #0E1116;border-radius:6px;height:44px"><button type="button" aria-label="Decrease quantity of {{i.name}}" style="width:40px;height:100%;border:0;background:transparent;font-size:20px;cursor:pointer">−</button><span style="width:28px;text-align:center;font-weight:600">{{i.qty}}</span><button type="button" aria-label="Increase quantity of {{i.name}}" style="width:40px;height:100%;border:0;background:transparent;font-size:20px;cursor:pointer">+</button></div>
<button type="button" style="height:44px;padding:0 4px;border:0;background:transparent;font-size:13px;color:#5B6470;text-decoration:underline;cursor:pointer;font-family:inherit">Remove</button>
</div>
</div>
</div>
</sc-for>

<div style="padding:18px 0;display:flex;flex-direction:column;gap:12px">
<span style="font-weight:600;font-size:15px">Add to your order</span>
<div style="display:flex;gap:12px;align-items:center;border:1px solid #E3E1DA;border-radius:10px;padding:10px">
<div style="width:56px;height:56px;border-radius:6px;background:#ECEAE4;display:flex;align-items:center;justify-content:center;flex:none"><svg sc-camel-view-box="0 0 120 150" style="height:42px" aria-hidden="true"><rect x="14" y="22" width="92" height="112" rx="12" fill="#5B6470"></rect><rect x="10" y="8" width="100" height="22" rx="7" fill="#0E1116"></rect><rect x="14" y="60" width="92" height="46" fill="#F6F5F1"></rect></svg></div>
<div style="flex-grow:1;display:flex;flex-direction:column"><span style="font-weight:600;font-size:14px">Daily Multivitamin</span><span style="font-size:13px;color:#5B6470">£00.00</span></div>
<button type="button" style="height:44px;padding:0 16px;border:1.5px solid #0E1116;border-radius:6px;background:transparent;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer">Add</button>
</div>
</div>
</div>

<div style="border-top:1px solid #E3E1DA;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 24px rgba(14,17,22,.06)">
<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:600"><span>Subtotal</span><span>£00.00</span></div>
<span style="font-size:12px;color:#5B6470;line-height:1.5">Delivery, VAT and any duties are shown at checkout.</span>
<a href="Checkout.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;background:#19C3A6;color:#0E1116;font-weight:600;font-size:16px;border-radius:8px">Checkout</a>
<a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;height:44px;font-weight:600;font-size:14px;text-decoration:underline">Continue shopping</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}">

  renderVals() {
    return {
      items: [
        { name: 'Whey Protein Isolate', variant: '[Flavour] · [1 kg]', qty: 1, tub: '#2B3440' },
        { name: 'Creatine Monohydrate', variant: '500 g · Subscribe and save', qty: 1, tub: '#19C3A6' },
        { name: 'Recovery Blend', variant: '[Flavour] · [00] servings', qty: 1, tub: '#3A4452' }
      ]
    };
  }
}
</script>
